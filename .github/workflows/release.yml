name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

        include:
          - os: windows-latest
            artifact_name: release-windows
            build_dir: build
            binary_paths: |
              build/Release/gitm.exe

          - os: macos-latest
            artifact_name: release-macos
            build_dir: build
            binary_paths: |
              build/gitm

          - os: ubuntu-latest
            artifact_name: release-linux
            build_dir: build
            binary_paths: |
              build/gitm

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Install vcpkg 
        uses: lukka/run-vcpkg@v11
        vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ runner.os == 'Windows' && env.VCPKG_INSTALLATION_ROOT || env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: gitm-${{ matrix.os }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true